<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIKE + Teachable Machine (iOS Fixed)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
    #webcam-container { margin: 15px auto; display: flex; justify-content: center; align-items: center; }
    #webcam-container video, #webcam-container canvas { border-radius: 12px; width: 100%; max-width: 280px; border: 3px solid #007aff; }
    button { padding: 14px 24px; margin: 8px; font-size: 16px; border-radius: 8px; border: none; background: #007aff; color: white; font-weight: bold; cursor: pointer;}
    #status { font-weight: bold; font-size: 1.1rem; margin-top: 15px; color: #007aff; }
    #label-container { font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>AI Robot Classifier</h2>
  <button onclick="loadModelFirst()">1. Load AI Model</button>
  <button onclick="connectBluetooth()">2. Connect Pybricks Hub</button>
  <button onclick="startCamera()">3. Start Camera & Run AI</button>

  <div id="webcam-container"></div>
  <div id="status">Status: Ready</div>
  <div id="label-container">Model not loaded</div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/egUzLqDO3/";
    let model, webcam, rxCharacteristic;

    // Step 1: Load Model first so it doesn't interfere with Bluetooth later
    async function loadModelFirst() {
      try {
        document.getElementById("status").innerText = "Loading AI Model...";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        document.getElementById("status").innerText = "Model Loaded Successfully!";
        document.getElementById("label-container").innerText = "Ready to connect Bluetooth";
      } catch (err) {
        alert("Model Load Error: " + err);
      }
    }

    // Step 2: Connect Bluetooth on a clean thread
async function connectBluetooth() {
  try {
    document.getElementById("status").innerText = "Searching for Hub...";
    
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ["6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
    });
    
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
    
    // 1. Grab RX characteristic (for phone -> hub commands)
    rxCharacteristic = await service.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");
    
    // 2. Grab TX characteristic and start notifications (forces hub to stop blinking!)
    const txCharacteristic = await service.getCharacteristic("6e400003-b5a3-f393-e0a9-e50e24dcca9e");
    await txCharacteristic.startNotifications();
    
    // Listen for incoming text printed from the hub
    txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
      const decoder = new TextDecoder();
      const value = decoder.decode(event.target.value);
      console.log("Hub says: ", value);
    });
    
    document.getElementById("status").innerText = "Status: Connected & Locked!";
    document.getElementById("label-container").innerText = "Hub linked successfully!";
  } catch (err) {
    alert("Bluetooth Connection Error: " + err);
    document.getElementById("status").innerText = "Status: Disconnected";
  }
}

    // Step 3: Start Camera
    async function startCamera() {
      try {
        document.getElementById("status").innerText = "Starting Camera...";
        const flip = true;
        webcam = new tmImage.Webcam(224, 224, flip);
        await webcam.setup({ facingMode: "environment" });
        await webcam.play();
        
        const container = document.getElementById("webcam-container");
        container.innerHTML = "";
        if (webcam.webcam) {
          webcam.webcam.setAttribute("playsinline", "true");
          webcam.webcam.setAttribute("autoplay", "true");
          container.appendChild(webcam.webcam);
        } else {
          container.appendChild(webcam.canvas);
        }
        
        document.getElementById("status").innerText = "Camera Active. Running AI...";
        window.requestAnimationFrame(loop);
      } catch (err) {
        alert("Camera Error: " + err);
      }
    }

    async function loop() {
      await predict();
      // 2-second delay interval to give iOS Bluetooth breathing room
      setTimeout(() => window.requestAnimationFrame(loop), 2000);
    }

    async function predict() {
      try {
        if (!model || !webcam) return;
        webcam.update();
        const predictions = await model.predict(webcam.canvas);
        let topPrediction = predictions[0]; 

        document.getElementById("label-container").innerText = 
          `${topPrediction.className}: ${(topPrediction.probability * 100).toFixed(1)}%`;

        if (rxCharacteristic) {
          const encoder = new TextEncoder();
          const command = topPrediction.probability > 0.60 ? "MATCH\n" : "NO_MATCH\n";
          await rxCharacteristic.writeValueWithoutResponse(encoder.encode(command));
          
          document.getElementById("status").innerText = topPrediction.probability > 0.60 ? 
            `Result: MATCH (${topPrediction.className})` : "Result: NO_MATCH Sent";
        }
      } catch (err) {
        console.error("Prediction loop error:", err);
      }
    }
  </script>
</body>
</html>
