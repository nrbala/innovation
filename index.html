<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE Prime Teachable Machine Bridge</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        button { padding: 12px 20px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background: #007aff; color: white; }
        #webcam-container { margin: 20px auto; border-radius: 12px; overflow: hidden; width: 224px; height: 224px; background: #ddd; }
        #status, #result { font-weight: bold; margin: 10px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>Robot Image Classifier</h1>
    
    <!-- Step Buttons -->
    <div>
        <button id="connectBtn" onclick="connectBluetooth()">1. Connect SPIKE Prime</button>
        <br>
        <button id="startCamBtn" onclick="initCamera()" disabled>2. Start iPhone Camera</button>
    </div>

    <div id="status">Status: Disconnected</div>
    <div id="webcam-container"></div>
    <div id="result">Result: Waiting for capture...</div>

    <!-- Load Teachable Machine dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <script>
        // REPLACE WITH YOUR ACTUAL TEACHABLE MACHINE MODEL URL (must include trailing slash)
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID_HERE/";

        let model, webcam, maxPredictions;
        let bluetoothDevice, uartServer, rxCharacteristic, txCharacteristic;

        // Nordic UART Service UUIDs used by Pybricks
        const NORDIC_UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NORDIC_UART_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Web -> Hub
        const NORDIC_UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Hub -> Web

        // 1. Connect to SPIKE Prime via Web Bluetooth
        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "Connecting to SPIKE Prime...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Pybricks' }, { namePrefix: 'Hub' }],
                    optionalServices: [NORDIC_UART_SERVICE]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(NORDIC_UART_SERVICE);
                
                rxCharacteristic = await service.getCharacteristic(NORDIC_UART_RX);
                txCharacteristic = await service.getCharacteristic(NORDIC_UART_TX);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingMessage);

                document.getElementById('status').innerText = "SPIKE Prime Connected!";
                document.getElementById('startCamBtn').disabled = false;
                console.log("Bluetooth Connected Successfully");

            } catch (error) {
                console.error("Bluetooth connection failed:", error);
                document.getElementById('status').innerText = "Connection Failed: " + error;
            }
        }

        // 2. Initialize Teachable Machine Model & Webcam
        async function initCamera() {
            try {
                document.getElementById('status').innerText = "Loading Teachable Machine Model...";
                
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // Load model and metadata dynamically to get ALL class names
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                
                const classLabels = model.getClassLabels();
                console.log("Successfully loaded classes from model metadata:", classLabels);
                document.getElementById('status').innerText = `Model Loaded! Classes: ${classLabels.join(', ')}`;

                // Setup webcam feed optimized for mobile/iPhone
                webcam = new tmImage.Webcam(224, 224, true); // true for front camera, false for rear
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Append webcam to DOM
                document.getElementById('webcam-container').innerHTML = "";
                document.getElementById('webcam-container').appendChild(webcam.canvas);

            } catch (error) {
                console.error("Camera/Model initialization error:", error);
                document.getElementById('status').innerText = "Camera Error: Check iOS Permissions.";
            }
        }

        async function loop() {
            webcam.update();
            window.requestAnimationFrame(loop);
        }

        // 3. Handle incoming data ("CAPTURE") sent from the SPIKE Prime hub
        function handleIncomingMessage(event) {
            const decoder = new TextDecoder();
            const message = decoder.decode(event.target.value).trim();
            console.log("Received from Hub:", message);

            if (message === "CAPTURE") {
                runPredictionAndRespond();
            }
        }

        // 4. Run classification on the current webcam frame and send result back
        async function runPredictionAndRespond() {
            if (!model || !webcam) return;

            // Predict current frame against all loaded classes
            const predictions = await model.predict(webcam.canvas);
            
            let topPrediction = "NO_MATCH";
            let highestProbability = 0;
            const CONFIDENCE_THRESHOLD = 0.75; // 75% accuracy threshold

            for (let i = 0; i < maxPredictions; i++) {
                if (predictions[i].probability > highestProbability) {
                    highestProbability = predictions[i].probability;
                    topPrediction = predictions[i].className;
                }
            }

            // If confidence is below threshold, send NO_MATCH
            if (highestProbability < CONFIDENCE_THRESHOLD) {
                topPrediction = "NO_MATCH";
            }

            document.getElementById('result').innerText = `Result: ${topPrediction} (${(highestProbability * 100).toFixed(1)}%)`;
            console.log(`Sending response to hub: ${topPrediction}`);

            // Send result string back to SPIKE Prime over BLE
            if (rxCharacteristic) {
                const encoder = new TextEncoder();
                const data = encoder.encode(topPrediction + "\n");
                await rxCharacteristic.writeValue(data);
            }
        }
    </script>
</body>
</html>
