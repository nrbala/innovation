<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot iPhone AI Bridge</title>
    <!-- Load TensorFlow.js and Teachable Machine Image libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- Load PeerJS for video and telemetry relay to laptop -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        button { background: #007aff; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; margin: 10px 0; width: 100%; max-width: 320px; cursor: pointer; }
        button:active { background: #0056b3; }
        #status { font-weight: bold; margin: 15px 0; color: #ff9500; }
        #peer-id { font-size: 24px; color: #34c759; margin: 10px 0; font-family: monospace; }
        video { width: 100%; max-width: 320px; border-radius: 8px; margin-top: 15px; background: #000; }
        .log-box { background: #222; padding: 10px; border-radius: 6px; text-align: left; font-family: monospace; font-size: 12px; height: 100px; overflow-y: scroll; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>iPhone AI & UART Bridge</h2>
    <div id="status">Status: Disconnected</div>

    <!-- Step 1: User gesture required for Web Bluetooth security -->
    <button id="connect-btn" onclick="connectHubAndAI()">1. Connect Pybricks Hub & Load AI</button>

    <!-- Step 2: Camera and PeerJS Setup -->
    <button id="stream-btn" onclick="startCameraAndStream()" disabled>2. Start Camera & Stream to Laptop</button>

    <div>
        <h3>Laptop Link ID:</h3>
        <div id="peer-id">Generating ID...</div>
    </div>

    <div>
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="log-box" id="logs">System logs will appear here...</div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/f8py7VUd2/";
        let model, webcam, maxPredictions;
        let bluetoothDevice, uartRxCharacteristic;
        let peer, activeConnection;
        let isRunning = false;

        function log(msg) {
            const box = document.getElementById('logs');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
            console.log(msg);
        }

        // Initialize PeerJS for Laptop Dashboard
        const peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('peer-id').innerText = id;
            log("PeerJS ready. Share ID with laptop.html");
        });

        peer.on('connection', (conn) => {
            activeConnection = conn;
            log("Laptop dashboard connected!");
            conn.on('data', (data) => log("From Laptop: " + data));
        });

        // Step 1: Connect to Pybricks Hub via Web Bluetooth & Load TM Model
        async function connectHubAndAI() {
            try {
                document.getElementById('status').innerText = "Connecting to Hub & AI...";
                log("Requesting Bluetooth Device...");

                // Pybricks Nordic UART Service UUIDs
                const PYBRICKS_SERVICE_UUID = '6e400101-b5a3-f393-e0a9-e50e24dcca9e';
                const UART_RX_CHARACTERISTIC = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // Write characteristic

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [PYBRICKS_SERVICE_UUID] }],
                    optionalServices: [PYBRICKS_SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
                uartRxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC);
                log("Bluetooth connected & UART RX bound!");

                // Load Teachable Machine Model
                log("Loading Teachable Machine Model...");
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                log("AI Model Loaded Successfully!");

                document.getElementById('status').innerText = "Hub & AI Connected!";
                document.getElementById('connect-btn').style.background = "#34c759";
                document.getElementById('stream-btn').disabled = false;

            } catch (error) {
                log("Error during connection: " + error);
                document.getElementById('status').innerText = "Connection Failed";
            }
        }

        // Step 2: Start Camera and AI Loop
        async function startCameraAndStream() {
            try {
                log("Starting camera feed...");
                const flip = true;
                webcam = new tmImage.Webcam(320, 240, flip);
                await webcam.setup(); // Requests camera permissions
                await webcam.play();
                document.getElementById('webcam').srcObject = webcam.webcam.srcObject;
                
                isRunning = true;
                window.requestAnimationFrame(loop);
                document.getElementById('status').innerText = "AI Streaming Active";
                document.getElementById('stream-btn').style.background = "#34c759";
                log("Camera loop running.");

            } catch (err) {
                log("Camera error: " + err);
            }
        }

        // Main AI Prediction & Command Loop
        async function loop() {
            if (!isRunning) return;
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Find highest confidence prediction
            let bestIndex = 0;
            let highestProb = 0;
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestIndex = i;
                }
            }

            let confidencePercent = Math.round(highestProb * 100);

            // If confidence is high (>75%), transmit command byte to Hub's Slot 2 script
            if (confidencePercent > 75 && uartRxCharacteristic) {
                try {
                    let commandChar = bestIndex.toString(); // Sends "0", "1", "2", or "3"
                    let data = new TextEncoder().encode(commandChar);
                    await uartRxCharacteristic.writeValue(data);
                    log(`Sent Class ${commandChar} (${confidencePercent}%) to hub`);
                } catch (err) {
                    console.error("UART write error:", err);
                }
            }

            // Stream telemetry to laptop dashboard if connected
            if (activeConnection && activeConnection.open) {
                activeConnection.send({
                    class: prediction[bestIndex].className,
                    confidence: confidencePercent
                });
            }
        }
    </script>
</body>
</html>
