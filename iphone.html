<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone AI Camera & Hub Bridge</title>

    <!-- PeerJS for video/data streaming -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        #webcam-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #webcam-container canvas, #webcam-container video { width: 100vw !important; height: 100vh !important; object-fit: cover !important; }
        .overlay-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; pointer-events: none; }
        .interactive { pointer-events: auto; }
        h2 { color: #fff; background: rgba(0,0,0,0.65); padding: 10px; border-radius: 8px; margin: 0 auto; font-size: 18px; text-align: center; }
        .bottom-section { background: rgba(0,0,0,0.85); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 360px; margin: 0 auto; }
        button { width: 100%; margin: 6px 0; padding: 14px; font-size: 15px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:active { background: #0056b3; }
        #status { font-size: 13px; color: #ffeb3b; margin-bottom: 6px; font-weight: bold; text-align: center; }
        #peer-id-display { color: #00ffcc; font-size: 13px; font-weight: bold; margin-top: 4px; text-align: center; }
    </style>
</head>
<body>

    <div id="webcam-container"></div>

    <div class="overlay-ui">
        <div class="top-section interactive">
            <h2>iPhone AI Camera Node</h2>
        </div>
        <div class="bottom-section interactive">
            <div id="status">Status: Ready to connect</div>
            <div id="peer-id-display">Generating Laptop Link ID...</div>
            <button onclick="connectHubAndLoadModel()">1. Connect Pybricks Hub & Load AI</button>
            <button onclick="startCameraAndStream()">2. Start Camera & Stream to Laptop</button>
        </div>
    </div>

    <script>
        const TM_URL = "https://teachablemachine.withgoogle.com/models/f8py7VUd2/";
        const NORDIC_UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let model, webcam, maxPredictions;
        let bluetoothDevice, uartCharacteristic;
        let peer, conn, localStream;

        // Generate clean PeerJS ID
        const shortId = Math.floor(1000 + Math.random() * 9000);
        const peerId = "iphone-robot-cam-" + shortId;
        peer = new Peer(peerId);

        peer.on('open', (id) => {
            document.getElementById("peer-id-display").innerText = "Laptop Link ID: " + id;
        });

        peer.on('connection', (c) => {
            conn = c;
            document.getElementById("status").innerText = "Connected to Laptop Dashboard!";
        });

        // Bluetooth MUST trigger immediately upon user tap to satisfy iOS gesture rules
        async function connectHubAndLoadModel() {
            try {
                document.getElementById("status").innerText = "Scanning for Pybricks Hub...";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [NORDIC_UART_SERVICE]
                });

                document.getElementById("status").innerText = "Connecting to Hub GATT Server...";
                const server = await bluetoothDevice.gatt.connect();

                document.getElementById("status").innerText = "Connecting UART Service...";
                const service = await server.getPrimaryService(NORDIC_UART_SERVICE);
                uartCharacteristic = await service.getCharacteristic(UART_TX_CHAR);

                const rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR);
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleHubMessage);

                document.getElementById("status").innerText = "Hub Connected! Loading AI Model...";
                model = await tmImage.load(TM_URL + "model.json", TM_URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                document.getElementById("status").innerText = "Hub Connected & AI Model Loaded!";
            } catch (err) {
                document.getElementById("status").innerText = "Error: " + err.message;
                console.error(err);
            }
        }

        function handleHubMessage(event) {
            const message = new TextDecoder().decode(event.target.value);
            if (conn) {
                const isReport = message.includes("FINAL") || message.includes("REPORT") || message.includes("Cycles Executed");
                conn.send({ type: isReport ? 'report' : 'log', data: message });
            }
        }

        async function startCameraAndStream() {
            if (!model) { alert("Please connect Hub and load AI model first!"); return; }

            try {
                document.getElementById("status").innerText = "Starting Camera...";
                webcam = new tmImage.Webcam(window.innerWidth, window.innerHeight, false);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();

                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                localStream = webcam.canvas.captureStream(30);
                if (conn) { peer.call(conn.peer, localStream); }

                window.requestAnimationFrame(loop);
                document.getElementById("status").innerText = "AI Camera Running & Streaming!";
            } catch (err) {
                document.getElementById("status").innerText = "Camera Error: " + err.message;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let best = prediction[0];
            for (let i = 1; i < maxPredictions; i++) {
                if (prediction[i].probability > best.probability) best = prediction[i];
            }
            let conf = Math.round(best.probability * 100);

            // Forward class prediction index to Pybricks Hub over Bluetooth
            if (uartCharacteristic && conf > 75) {
                let classIndex = prediction.findIndex(p => p.className === best.className);
                let data = new TextEncoder().encode(classIndex + "\n");
                try {
                    await uartCharacteristic.writeValue(data);
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
