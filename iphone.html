<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioScan Transmitter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; 
            height: 100dvh; 
            background: #000; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
        }

        .header {
            height: 44px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            z-index: 10;
        }

        .camera-viewport { 
            flex: 1;
            position: relative; 
            background: #111;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .camera-viewport canvas, .camera-viewport video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }

        #start-btn {
            z-index: 20;
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
        }

        .prediction-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .class-name { font-size: 1rem; font-weight: bold; color: #00ffcc; }
        .confidence { font-size: 0.95rem; font-family: monospace; color: #fff; }

        .hud-bottom {
            height: 65px;
            width: 100vw;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .hud-label { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #aaa; 
            line-height: 1.1;
        }

        #room-code { 
            font-size: 1.3rem; 
            font-weight: 700; 
            letter-spacing: 3px; 
            color: #00ffcc; 
            font-family: monospace; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">BioScan Transmitter</div>

        <div class="camera-viewport" id="webcam-container">
            <button id="start-btn" onclick="startCamera()">Start Camera</button>
            
            <div class="prediction-overlay">
                <span class="class-name" id="detected-class">Tap Start Camera</span>
                <span class="confidence" id="detected-confidence">0%</span>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="hud-card">
                <div class="hud-label">ROOM<br>ID:</div>
                <span id="room-code">----</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="text/javascript">
        // Updated Teachable Machine model URL with new ID f8py7VUd2s
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/f8py7VUd2s/";
        
        let model, webcam, peer, conn;

        const roomCode = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code').innerText = roomCode;

        peer = new Peer(`bioscan-${roomCode}`);
        peer.on('connection', (connection) => {
            conn = connection;
        });

        async function startCamera() {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("detected-class").innerText = "Loading Model...";

            try {
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

                const flip = false;
                webcam = new tmImage.Webcam(400, 400, flip);
                
                await webcam.setup({ facingMode: { exact: "environment" } }).catch(async () => {
                    await webcam.setup({ facingMode: "environment" });
                });

                await webcam.play();
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Camera Error:", err);
                document.getElementById("detected-class").innerText = "Camera Access Denied";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model) return;
            const prediction = await model.predict(webcam.canvas);
            let best = prediction.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            
            document.getElementById("detected-class").innerText = best.className;
            document.getElementById("detected-confidence").innerText = `${(best.probability * 100).toFixed(0)}%`;

            if (conn && conn.open) {
                conn.send({
                    class: best.className,
                    probability: best.probability,
                    timestamp: Date.now()
                });
            }
        }
    </script>
</body>
</html>
