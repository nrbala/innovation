<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BioScan Transmitter</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #webcam-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #webcam-container canvas, #webcam-container video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        
        /* Floating bottom HUD for room code */
        .hud-bottom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            color: #fff;
        }
        .hud-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        #room-code { font-size: 1.4rem; font-weight: bold; letter-spacing: 3px; color: #00ffcc; font-family: monospace; }
    </style>
</head>
<body>

    <div id="webcam-container"></div>

    <div class="hud-bottom">
        <span class="hud-label">Room ID:</span>
        <span id="room-code">----</span>
    </div>

    <!-- Load TensorFlow.js, Teachable Machine, and PeerJS -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="text/javascript">
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/WIpR1ZP5s/";
        
        let model, webcam, peer, conn;
        const roomCode = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code').innerText = roomCode;

        async function init() {
            try {
                // Load Teachable Machine model
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

                // Setup full screen mobile camera (rear camera preference)
                webcam = new tmImage.Webcam(window.innerWidth, window.innerHeight, true);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                // Initialize PeerJS broadcaster
                peer = new Peer(`bioscan-${roomCode}`);
                peer.on('connection', (connection) => {
                    conn = connection;
                    setupDataConnection();
                });

                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        function setupDataConnection() {
            conn.on('open', () => {
                console.log("Laptop connected successfully");
            });
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let best = prediction.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            
            // Transmit results to laptop if connected
            if (conn && conn.open) {
                conn.send({
                    class: best.className,
                    probability: best.probability,
                    timestamp: Date.now()
                });
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
