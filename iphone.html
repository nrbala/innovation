<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioScan Transmitter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; 
            height: 100dvh; 
            background: #000; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        /* Strict Flex Container locked to dynamic viewport */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
        }

        /* Top Header */
        .header {
            height: 44px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Camera Section - Takes remaining flexible space */
        .camera-viewport { 
            flex: 1;
            position: relative; 
            background: #111;
            width: 100vw;
            overflow: hidden;
        }
        
        /* Force canvas/video to fill container */
        .camera-viewport canvas, .camera-viewport video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }

        /* On-Screen Telemetry Overlay */
        .prediction-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .class-name { font-size: 1rem; font-weight: bold; color: #00ffcc; }
        .confidence { font-size: 0.95rem; font-family: monospace; color: #fff; }

        /* Bottom Room ID HUD - Fixed height to guarantee visibility */
        .hud-bottom {
            height: 65px;
            width: 100vw;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .hud-label { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #aaa; 
            line-height: 1.1;
        }

        #room-code { 
            font-size: 1.3rem; 
            font-weight: 700; 
            letter-spacing: 3px; 
            color: #00ffcc; 
            font-family: monospace; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Title -->
        <div class="header">BioScan Transmitter</div>

        <!-- Camera Container -->
        <div class="camera-viewport" id="webcam-container">
            <!-- Model Live Telemetry Overlay -->
            <div class="prediction-overlay">
                <span class="class-name" id="detected-class">Initializing Model...</span>
                <span class="confidence" id="detected-confidence">0%</span>
            </div>
        </div>

        <!-- Bottom Room ID HUD -->
        <div class="hud-bottom">
            <div class="hud-card">
                <div class="hud-label">ROOM<br>ID:</div>
                <span id="room-code">----</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="text/javascript">
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/f8py7VUd2s/";
        
        let model, webcam, peer, conn;

        // Generate 4-digit code immediately on load
        const roomCode = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code').innerText = roomCode;

        async function init() {
            try {
                // Initialize PeerJS broadcaster
                peer = new Peer(`bioscan-${roomCode}`);
                peer.on('connection', (connection) => {
                    conn = connection;
                });

                // Load Teachable Machine model
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

                // Setup camera stream
                const flip = false;
                webcam = new tmImage.Webcam(400, 400, flip);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById("detected-class").innerText = "Camera Error";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model) return;
            const prediction = await model.predict(webcam.canvas);
            let best = prediction.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            
            // Update on-screen telemetry
            document.getElementById("detected-class").innerText = best.className;
            document.getElementById("detected-confidence").innerText = `${(best.probability * 100).toFixed(0)}%`;

            // Transmit results to laptop
            if (conn && conn.open) {
                conn.send({
                    class: best.className,
                    probability: best.probability,
                    timestamp: Date.now()
                });
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
