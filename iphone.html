<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BioScan Transmitter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100vw; 
            height: 100dvh; 
            background: #000; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100dvh;
            padding-top: env(safe-area-inset-top);
        }

        /* Top Header */
        .header {
            height: 44px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Full Screen Camera Viewport */
        .camera-viewport { 
            flex: 1;
            position: relative; 
            background: #000;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Force Teachable Machine canvas and video to fill the screen edge-to-edge */
        .camera-viewport canvas, .camera-viewport video { 
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100% !important; 
            min-height: 100% !important; 
            width: auto !important;
            height: auto !important;
            object-fit: cover !important; 
        }

        /* Start Button Overlay */
        #start-btn {
            z-index: 20;
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.5);
        }

        /* Live Telemetry Overlay */
        .prediction-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .class-name { font-size: 1rem; font-weight: bold; color: #00ffcc; }
        .confidence { font-size: 0.95rem; font-family: monospace; color: #fff; }

        /* Bottom HUD Area with iPhone 15 Pro Safe Area padding */
        .hud-bottom {
            height: 70px;
            width: 100vw;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .hud-label { 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #aaa; 
            line-height: 1.1;
        }

        #room-code { 
            font-size: 1.4rem; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: #00ffcc; 
            font-family: monospace; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header" id="header-title">BioScan Transmitter</div>

        <div class="camera-viewport" id="webcam-container">
            <button id="start-btn" onclick="startCamera()">Start Camera</button>
            
            <div class="prediction-overlay">
                <span class="class-name" id="detected-class">Tap Start Camera</span>
                <span class="confidence" id="detected-confidence">0%</span>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="hud-card">
                <div class="hud-label">ROOM<br>ID:</div>
                <span id="room-code">----</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script type="text/javascript">
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/f8py7VUd2/";
        
        let model, webcam, peer, conn;

        const roomCode = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code').innerText = roomCode;

        peer = new Peer(`spike-robot-${roomCode}`, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            document.getElementById('header-title').innerText = "Connected to Laptop";
            document.getElementById('header-title').style.color = "#00ffcc";
            
            conn.on('close', () => {
                document.getElementById('header-title').innerText = "BioScan Transmitter";
                document.getElementById('header-title').style.color = "#fff";
            });
        });

        peer.on('call', (mediaCall) => {
            const stream = webcam && webcam.canvas ? webcam.canvas.captureStream(30) : document.createElement('canvas').captureStream(30);
            mediaCall.answer(stream);
        });

        async function startCamera() {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("detected-class").innerText = "Loading Model...";

            try {
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

                // Match screen dimensions for the iPhone 15 Pro viewport
                const width = window.innerWidth;
                const height = window.innerHeight;
                webcam = new tmImage.Webcam(width, height, false);
                
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Camera Error:", err);
                document.getElementById("detected-class").innerText = "Camera Access Denied";
            }
        }

        async function loop() {
            if (webcam && webcam.canvas) {
                webcam.update();
                await predict();
            }
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            if (!model) return;
            const prediction = await model.predict(webcam.canvas);
            let best = prediction.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            
            document.getElementById("detected-class").innerText = best.className;
            document.getElementById("detected-confidence").innerText = `${(best.probability * 100).toFixed(0)}%`;

            if (conn && conn.open) {
                conn.send({
                    topClass: best.className,
                    probability: best.probability,
                    allClasses: prediction.map(p => ({ class: p.className, prob: p.probability }))
                });
            }
        }
    </script>
</body>
</html>
