<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BioScan Transmitter</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        /* Top Header Bar */
        .header {
            height: 45px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            z-index: 10;
        }

        /* 90% Camera Container */
        #webcam-container { 
            height: calc(90vh - 45px); 
            width: 100vw; 
            position: relative; 
            background: #111;
            overflow: hidden;
        }
        
        #webcam-container canvas, #webcam-container video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }

        /* Bottom 10% HUD Area */
        .hud-bottom {
            height: 10vh;
            width: 100vw;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 24px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .hud-label { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #aaa; 
            line-height: 1.1;
            text-align: left;
        }

        #room-code { 
            font-size: 1.5rem; 
            font-weight: 700; 
            letter-spacing: 4px; 
            color: #00ffcc; 
            font-family: monospace; 
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="header">BioScan Transmitter</div>

    <!-- 90% Screen Camera Viewport -->
    <div id="webcam-container"></div>

    <!-- Bottom 10% Room ID Display -->
    <div class="hud-bottom">
        <div class="hud-card">
            <div class="hud-label">ROOM<br>ID:</div>
            <span id="room-code">----</span>
        </div>
    </div>

    <!-- Load TensorFlow.js, Teachable Machine, and PeerJS -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script type="text/javascript">
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/WIpR1ZP5s/";
        
        let model, webcam, peer, conn;
        const roomCode = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('room-code').innerText = roomCode;

        async function init() {
            try {
                // Load Teachable Machine model
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

                // Setup camera aspect to fit viewport
                const container = document.getElementById("webcam-container");
                webcam = new tmImage.Webcam(container.clientWidth, container.clientHeight, true);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                
                container.appendChild(webcam.canvas);
                
                // Initialize PeerJS broadcaster
                peer = new Peer(`bioscan-${roomCode}`);
                peer.on('connection', (connection) => {
                    conn = connection;
                });

                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let best = prediction.reduce((prev, current) => (prev.probability > current.probability) ? prev : current);
            
            // Transmit top detection to laptop
            if (conn && conn.open) {
                conn.send({
                    class: best.className,
                    probability: best.probability,
                    timestamp: Date.now()
                });
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
